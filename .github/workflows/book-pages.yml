name: Deploy mdBook
on:
  push:
    branches: [main]
    paths: ["docs/book/**",".github/workflows/book-pages.yml"]
  pull_request:
    paths: ["docs/book/**",".github/workflows/book-pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: book-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    uses: ryancinsight/atlas/.github/workflows/book-pages.yml@53eb15ae2fa7ee9192e5d006989a430269fdc881
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      output-path: target/book/proteus
      mdbook-test: true
      rust-toolchain: "1.97.0"
      cargo-package: proteus
