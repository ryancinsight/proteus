name: Deploy mdBook

on:

  push:

    branches: [main]

    paths: ["docs/book/**",".github/workflows/book-pages.yml"]

  pull_request:

    paths: ["docs/book/**",".github/workflows/book-pages.yml"]

  workflow_dispatch:

permissions:

  contents: read

concurrency:

  group: book-pages-${{ github.ref }}

  cancel-in-progress: true

jobs:

  deploy:

    uses: ryancinsight/atlas/.github/workflows/book-pages.yml@20c93980f7c98f2e23a89c4a0540f16c8f2d7239

    permissions:

      contents: read

      pages: write

      id-token: write

    with:

      output-path: target/book/proteus

      mdbook-test: true

      rust-toolchain: "1.97.0"

      # Package name is `proteus-mat` on the registry; `proteus` belongs to an
      # unrelated third-party crate, so `cargo package -p proteus` fails with
      # "package ID specification `proteus` did not match any packages".
      cargo-package: proteus-mat
      # The [lib] target keeps the `proteus` name (that is the whole point of
      # the rename), so the shared workflow must stage `libproteus-*.rlib` for
      # `mdbook test --library-path`; deriving the crate name from the package
      # would look for `libproteus_mat-*` and stage nothing, leaving every
      # `extern crate proteus;` book sample failing E0463.
      cargo-crate: proteus