name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: proteus-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Guards the one artifact whose correctness cannot be checked from inside the
  # overlay environment that produces it. Calls the shared Atlas workflow.
  lockfile:
    name: Lockfile integrity
    uses: ryancinsight/atlas/.github/workflows/lockfile-guard.yml@886d85b0e4bea20c8e5ec4b4239e6ba9cdbcf74d
    permissions:
      contents: read

  verify:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b
        with:
          components: clippy, rustfmt
      - uses: taiki-e/install-action@ea4c0b50b0d394ee91c5bb68a6a295b0556feb8e
      - name: Format
        run: cargo fmt --all -- --check
      - name: Feature check
        run: cargo check --locked --no-default-features
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Native tests
        run: cargo nextest run --locked --all-features
      - name: Documentation tests
        run: cargo test --locked --doc --all-features
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features
      - name: Example
        run: cargo run --locked --example constant_material
      - name: Temperature example
        run: cargo run --locked --example temperature_material

  msrv:
    name: MSRV
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b
        with:
          toolchain: 1.95.0
      - name: Build at declared MSRV
        run: cargo check --locked --all-targets --all-features

  semver:
    name: SemVer
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239
        with:
          package: proteus-mat
          manifest-path: Cargo.toml
          rust-toolchain: 1.97.0
          baseline-rev: ${{ github.event.pull_request.base.sha || github.event.before }}
          verbose: true

  supply-chain:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
